<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어, 2분이면?!</title>
<meta name="description" content="문학 작품과 수능·모의고사 비문학 지문을 짧은 영상으로 정리한 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f6f2ea; --ink: #18213a; --sub: #6b6458; --line: #e2d9c8; --navy: #18213a; --red: #d8432a;
    --chip: #ebe4d6; --chip-on: #18213a; --chip-on-ink: #fff; --field: #fffdf8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12151c; --ink: #eef0f5; --sub: #a3a9b7; --line: #2a303d; --navy: #0b0e14;
      --chip: #232937; --chip-on: #eef0f5; --chip-on-ink: #12151c; --field: #1b202b; --red: #f0634a; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: -0.01em; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }

  /* 머리: 종이 바탕 + 큰 제목 + 최근 표지 3장 */
  header { overflow: hidden; border-bottom: 1px solid var(--line); }
  header .wrap { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding-top: 40px; padding-bottom: 36px; }
  h1 { margin: 0; font-size: clamp(44px, 11vw, 88px); font-weight: 900; letter-spacing: -0.05em; line-height: 1; word-break: keep-all; }
  h1 b { color: var(--red); }
  .lead { margin: 16px 0 0; color: var(--sub); font-size: 16px; line-height: 1.55; max-width: 460px; word-break: keep-all; }
  .go { display: inline-flex; align-items: center; gap: 8px; margin-top: 20px; color: #fff; background: var(--red); text-decoration: none;
    font-weight: 800; font-size: 15px; padding: 11px 18px; border-radius: 999px; }
  .go:hover { filter: brightness(1.08); }
  .go svg { width: 18px; height: 18px; }
  .fan { position: relative; width: 330px; height: 300px; }
  .fan img { position: absolute; top: 10px; width: 150px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 12px;
    box-shadow: 0 10px 24px rgba(0,0,0,.22); background: var(--chip); transform: scale(1); }
  .fan img:nth-child(1) { left: 0; transform: rotate(-9deg); top: 30px; }
  .fan img:nth-child(2) { left: 90px; z-index: 2; }
  .fan img:nth-child(3) { left: 180px; transform: rotate(9deg); top: 30px; }
  @media (max-width: 720px) { header .wrap { grid-template-columns: 1fr; padding-top: 30px; padding-bottom: 28px; } .fan { display: none; } }

  /* 거르는 줄 */
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 12px; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { .bar { position: static; } }
  .tabs { display: flex; gap: 4px; background: var(--chip); padding: 4px; border-radius: 14px; width: fit-content; max-width: 100%; }
  .tabs button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; font-weight: 800;
    padding: 9px 16px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .tabs small { font-weight: 500; opacity: .65; margin-left: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  /* 폰에서는 하위 분류가 줄바꿈 없이 옆으로 밀린다 */
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-left: -16px; margin-right: -16px; padding: 0 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; background: var(--chip); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--red); color: #fff; }
  select, input[type=search] { font: inherit; font-size: 15px; color: var(--ink); background: var(--field); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; min-width: 0; }
  input[type=search] { flex: 1 1 200px; }
  select { flex: 0 1 260px; }

  .count { color: var(--sub); font-size: 14px; margin: 18px 0 8px; }
  main { padding-bottom: 20px; }
  .group { margin-top: 26px; }
  .group h2 { font-size: 18px; font-weight: 900; margin: 0 0 12px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .group h2 span { color: var(--sub); font-weight: 600; font-size: 14px; }

  /* 카드: 테두리 없이 표지를 크게 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 30px 20px; } }
  .card { display: block; text-decoration: none; color: inherit; }
  .card:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; border-radius: 16px; }
  .thumb { position: relative; aspect-ratio: 9 / 16; background: var(--chip); border-radius: 14px; overflow: hidden;
    box-shadow: 0 6px 18px rgba(24,33,58,.18); transition: transform .18s ease, box-shadow .18s ease; }
  .card:hover .thumb { transform: translateY(-3px); box-shadow: 0 12px 26px rgba(24,33,58,.26); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04); }
  .new { position: absolute; top: 10px; left: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 900;
    letter-spacing: .06em; padding: 4px 8px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .tag { display: block; margin-top: 11px; font-size: 13px; font-weight: 800; color: var(--red); }
  .t { margin: 3px 0 0; font-size: 17px; font-weight: 800; line-height: 1.3; letter-spacing: -0.02em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
  .qn { margin: 5px 0 0; font-size: 14px; line-height: 1.4; color: var(--ink); opacity: .85; word-break: keep-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .m { margin: 4px 0 0; font-size: 13px; color: var(--sub); line-height: 1.4; word-break: keep-all; }
  .empty { padding: 40px 0; text-align: center; color: var(--sub); }
  footer { margin: 30px 0 40px; color: var(--sub); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div>
      <h1>국어,<br><b>2분</b>이면?!</h1>
      <p class="lead">문학 작품과 수능·모의고사 비문학 지문을 2분 안팎의 영상으로 풀었어요. 표지를 누르면 유튜브에서 볼 수 있어요.</p>
      <a class="go" href="https://www.youtube.com/@블랙락-u2v/shorts" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>유튜브 채널에서 보기</a>
    </div>
    <div class="fan" id="fan" aria-hidden="true"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">
    <div class="tabs" role="group" aria-label="갈래">
      <button data-type="all" aria-pressed="true">전체<small id="n-all"></small></button>
      <button data-type="문학" aria-pressed="false">문학<small id="n-lit"></small></button>
      <button data-type="비문학" aria-pressed="false">비문학<small id="n-non"></small></button>
    </div>
    <div class="row chips" id="fields" role="group" aria-label="세부 분류"></div>
    <div class="row" id="sortrow"><select id="sort" aria-label="정렬"><option value="order">올린 순서</option><option value="group">지문별로 묶기</option></select></div>
    <div class="row">
      <select id="exam" aria-label="시험"></select>
      <input id="q" type="search" placeholder="제목·작가·시험으로 찾기" aria-label="검색">
    </div>
  </div>

  <p class="count" id="count"></p>
  <main id="list"></main>
  <footer>새 영상은 올라오는 대로 추가됩니다.</footer>
</div>

<script src="videos.js"></script>
<script>
const V = (window.VIDEOS || []).filter((v) => !v.hidden).sort((a, b) => a.order - b.order);
const $ = (s) => document.querySelector(s);
const state = { type: "all", sub: null, exam: "", q: "", sort: "order" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// 올린 지 7일 안 = 새로 올라옴
const isNew = (d) => d && (Date.now() - new Date(d + "T00:00:00+09:00")) < 7 * 864e5;

$("#n-all").textContent = V.length;
$("#n-lit").textContent = V.filter((v) => v.type === "문학").length;
$("#n-non").textContent = V.filter((v) => v.type === "비문학").length;

// 갈래별 하위 버튼: 문학 = 현대·고전, 비문학 = 분야
const SUBS = {
  "문학": { key: "era", all: "전체", items: ["현대", "고전"], label: (x) => x + " 문학" },
  "비문학": { key: "field", all: "전체", items: [...new Set(V.filter((v) => v.field).map((v) => v.field))] },
};
function drawSubs() {
  const s = SUBS[state.type];
  $("#fields").style.display = s ? "" : "none";
  $("#sortrow").style.display = state.type === "비문학" ? "" : "none";
  if (!s) return;
  $("#fields").innerHTML = `<button class="chip" data-sub="" aria-pressed="${!state.sub}">${s.all}</button>` +
    s.items.map((f) => `<button class="chip" data-sub="${esc(f)}" aria-pressed="${state.sub === f}">${esc(s.label ? s.label(f) : f)}</button>`).join("");
}

// 시험 목록 (최근 것 먼저)
const exams = [...new Set(V.filter((v) => v.exam).map((v) => v.exam))];
$("#exam").innerHTML = '<option value="">시험 전체</option>' + exams.map((e) => `<option>${esc(e)}</option>`).join("");

function card(v) {
  const lit = v.type === "문학";
  const tag = lit ? `${v.era ? v.era + " " : ""}문학` : `비문학 · ${v.field || "기타"}`;
  const meta = lit ? (v.author || "") : [v.exam, v.items && `${v.items}번`].filter(Boolean).join(" · ");
  const url = `https://www.youtube.com/shorts/${v.id}`;
  return `<a class="card" href="${url}" target="_blank" rel="noopener">
    <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg"
      onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'">${isNew(v.date) ? '<span class="new">NEW</span>' : ""}</div>
    <span class="tag">${esc(tag)}</span>
    <p class="t">${esc(v.title)}</p>
    <p class="m">${esc(meta)}</p></a>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const key = SUBS[state.type] && SUBS[state.type].key;
  const list = V.filter((v) =>
    (state.type === "all" || v.type === state.type) &&
    (!state.sub || !key || v[key] === state.sub) &&
    (!state.exam || v.exam === state.exam) &&
    (!q || [v.title, v.author, v.work, v.exam, v.field, v.era, v.type, v.question].join(" ").toLowerCase().includes(q)));
  drawSubs();
  $("#count").textContent = `${list.length}편`;
  if (!list.length) { $("#list").innerHTML = '<p class="empty">조건에 맞는 영상이 없어요.</p>'; return; }
  // 기본은 올린 순서(최신 먼저). 비문학에서 '지문별로 묶기'를 고르면 같은 시험·문항끼리 묶는다
  if (state.type === "비문학" && state.sort === "group") {
    const groups = new Map();
    list.forEach((v) => { const k = v.exam ? `${v.exam}|${v.items || ""}` : "기타"; (groups.get(k) || groups.set(k, []).get(k)).push(v); });
    $("#list").innerHTML = [...groups].map(([k, vs]) => {
      const [exam, items] = k.split("|");
      const head = k === "기타" ? "그 밖의 영상" : `${esc(exam)} <span>${esc(items ? items + "번" : "")} · ${vs.length}편</span>`;
      return `<section class="group"><h2>${head}</h2><div class="grid">${vs.map(card).join("")}</div></section>`;
    }).join("");
  } else {
    $("#list").innerHTML = `<div class="grid">${list.map(card).join("")}</div>`;
  }
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  state.type = b.dataset.type; state.sub = null;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render();
});
$("#fields").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; state.sub = c.dataset.sub || null; render(); };
$("#exam").onchange = (e) => { state.exam = e.target.value; render(); };
$("#sort").onchange = (e) => { state.sort = e.target.value; render(); };
$("#q").oninput = (e) => { state.q = e.target.value; render(); };
const thumb = (id) => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
$("#fan").innerHTML = V.slice(0, 3).reverse().map((v) => `<img alt="" src="${thumb(v.id)}">`).join("");
render();
</script>
</body>
</html>
