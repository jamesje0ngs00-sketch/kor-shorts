<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 쇼츠 모음</title>
<meta name="description" content="문학 작품과 수능·모의고사 비문학 지문을 짧은 영상으로 정리한 모음">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root {
    --bg: #f4efe6; --card: #fffdf8; --ink: #1f2a44; --sub: #6b6458; --line: #e2d9c8;
    --accent: #c8432b; --chip: #ece4d4; --chip-on: #1f2a44; --chip-on-ink: #fff;
    --lit: #3f6f5a; --sci: #3f6fa0; --eco: #b0772a; --soc: #7a5aa0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171a21; --card: #1f2430; --ink: #eef0f5; --sub: #a3a9b7; --line: #2e3442;
      --chip: #2a303d; --chip-on: #eef0f5; --chip-on-ink: #171a21; --accent: #f0735c; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    letter-spacing: -0.01em; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; }
  header { padding: 28px 0 8px; }
  h1 { margin: 0; font-size: clamp(28px, 6vw, 40px); font-weight: 900; letter-spacing: -0.03em; }
  h1 b { color: var(--accent); }
  .lead { margin: 8px 0 0; color: var(--sub); font-size: 15px; line-height: 1.5; }
  .lead a { color: inherit; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; border-bottom: 1px solid var(--line); }
  @media (max-width: 600px) { .bar { position: static; } }
  .tabs { display: flex; gap: 6px; background: var(--chip); padding: 4px; border-radius: 14px; width: fit-content; max-width: 100%; }
  .tabs button { border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; font-weight: 700;
    padding: 9px 16px; border-radius: 10px; cursor: pointer; white-space: nowrap; }
  .tabs button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
  .tabs small { font-weight: 500; opacity: .7; margin-left: 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600;
    padding: 7px 13px; border-radius: 999px; cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  select, input[type=search] { font: inherit; font-size: 15px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 12px; min-width: 0; }
  input[type=search] { flex: 1 1 200px; }
  select { flex: 0 1 260px; }
  .count { color: var(--sub); font-size: 14px; margin: 16px 0 6px; }
  .group { margin-top: 22px; }
  .group h2 { font-size: 16px; font-weight: 800; margin: 0 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .group h2 span { color: var(--sub); font-weight: 600; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; } }
  .card { display: block; text-decoration: none; color: inherit; background: var(--card); border-radius: 14px; overflow: hidden;
    border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
  .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .thumb { aspect-ratio: 9 / 16; background: var(--chip); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .body { padding: 10px 11px 12px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 6px; color: #fff; background: var(--sub); }
  .tag.문학 { background: var(--lit); } .tag.과학 { background: var(--sci); } .tag.경제 { background: var(--eco); } .tag.사회 { background: var(--soc); }
  .t { margin: 7px 0 4px; font-size: 15px; font-weight: 700; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; word-break: keep-all; }
  .m { font-size: 13px; color: var(--sub); line-height: 1.4; word-break: keep-all; }
  .empty { padding: 40px 0; text-align: center; color: var(--sub); }
  footer { margin-top: 40px; color: var(--sub); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>국어 <b>쇼츠</b> 모음</h1>
    <p class="lead">문학 작품과 수능·모의고사 비문학 지문을 짧은 영상으로 정리했어요. 카드를 누르면 유튜브에서 볼 수 있어요.
      · <a href="https://www.youtube.com/@블랙락-u2v/shorts" target="_blank" rel="noopener">채널 바로가기</a></p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="갈래">
      <button data-type="all" aria-pressed="true">전체<small id="n-all"></small></button>
      <button data-type="문학" aria-pressed="false">문학<small id="n-lit"></small></button>
      <button data-type="비문학" aria-pressed="false">비문학<small id="n-non"></small></button>
    </div>
    <div class="row" id="fields" role="group" aria-label="분야"></div>
    <div class="row">
      <select id="exam" aria-label="시험"></select>
      <input id="q" type="search" placeholder="제목·작가·시험으로 찾기" aria-label="검색">
    </div>
  </div>

  <p class="count" id="count"></p>
  <main id="list"></main>
  <footer>새 영상은 올라오는 대로 추가됩니다.</footer>
</div>

<script src="videos.js"></script>
<script>
const V = (window.VIDEOS || []).slice().sort((a, b) => a.order - b.order);
const $ = (s) => document.querySelector(s);
const state = { type: "all", field: null, exam: "", q: "" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

$("#n-all").textContent = V.length;
$("#n-lit").textContent = V.filter((v) => v.type === "문학").length;
$("#n-non").textContent = V.filter((v) => v.type === "비문학").length;

// 분야 칩 (비문학)
const fields = [...new Set(V.filter((v) => v.field).map((v) => v.field))];
$("#fields").innerHTML = '<button class="chip" data-field="" aria-pressed="true">분야 전체</button>' +
  fields.map((f) => `<button class="chip" data-field="${esc(f)}" aria-pressed="false">${esc(f)}</button>`).join("");

// 시험 목록 (최근 것 먼저)
const exams = [...new Set(V.filter((v) => v.exam).map((v) => v.exam))];
$("#exam").innerHTML = '<option value="">시험 전체</option>' + exams.map((e) => `<option>${esc(e)}</option>`).join("");

function card(v) {
  const tag = v.type === "문학" ? "문학" : (v.field || "비문학");
  const meta = v.type === "문학" ? (v.author ? `${v.author} 작` : "작품 해설")
    : [v.exam, v.items && `${v.items}번`].filter(Boolean).join(" · ");
  const url = `https://www.youtube.com/shorts/${v.id}`;
  return `<a class="card" href="${url}" target="_blank" rel="noopener">
    <div class="thumb"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${v.id}/maxresdefault.jpg"
      onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${v.id}/hqdefault.jpg'"></div>
    <div class="body"><span class="tag ${esc(tag)}">${esc(tag)}</span>
      <p class="t">${esc(v.title)}</p><p class="m">${esc(meta)}</p></div></a>`;
}

function render() {
  const q = state.q.trim().toLowerCase();
  const list = V.filter((v) =>
    (state.type === "all" || v.type === state.type) &&
    (!state.field || v.field === state.field) &&
    (!state.exam || v.exam === state.exam) &&
    (!q || [v.title, v.author, v.work, v.exam, v.field, v.type].join(" ").toLowerCase().includes(q)));
  $("#fields").style.display = state.type === "문학" ? "none" : "";
  $("#count").textContent = `${list.length}편`;
  if (!list.length) { $("#list").innerHTML = '<p class="empty">조건에 맞는 영상이 없어요.</p>'; return; }
  // 비문학은 같은 지문(시험·문항)끼리 묶어서 보여 준다
  if (state.type === "비문학") {
    const groups = new Map();
    list.forEach((v) => { const k = v.exam ? `${v.exam}|${v.items || ""}` : "기타"; (groups.get(k) || groups.set(k, []).get(k)).push(v); });
    $("#list").innerHTML = [...groups].map(([k, vs]) => {
      const [exam, items] = k.split("|");
      const head = k === "기타" ? "그 밖의 영상" : `${esc(exam)} <span>${esc(items ? items + "번" : "")} · ${vs.length}편</span>`;
      return `<section class="group"><h2>${head}</h2><div class="grid">${vs.map(card).join("")}</div></section>`;
    }).join("");
  } else {
    $("#list").innerHTML = `<div class="grid">${list.map(card).join("")}</div>`;
  }
}

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => {
  state.type = b.dataset.type;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  if (state.type === "문학") { state.field = null; setChip(""); }
  render();
});
function setChip(f) { document.querySelectorAll("#fields .chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.field === f)); }
$("#fields").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; state.field = c.dataset.field || null; setChip(c.dataset.field); render(); };
$("#exam").onchange = (e) => { state.exam = e.target.value; render(); };
$("#q").oninput = (e) => { state.q = e.target.value; render(); };
render();
</script>
</body>
</html>
